name: Apply reviewed header 1.7.3 checkpoint
on:
  push:
    branches: [test]
    paths: ['.github/checkpoints/apply_header173.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply the hash-guarded, locally tested source changes
        run: |
          set -euo pipefail
          python3 .github/checkpoints/apply_header173.py
          python3 -m compileall -q scripts audit162 repair162
          git diff --check
          git add -- native/AlignedGlass.m repair162 audit162 scripts docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore category glass and contain cycling search words in 1.7.3"
          git push origin HEAD:test
