name: Verify FanqieX 1.76

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify176-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the runner's preinstalled LLVM and Clang
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          /usr/bin/clang-18 --version
          echo 'FQ_NATIVE_CLANG=/usr/bin/clang-18' >> "$GITHUB_ENV"
          python3 - <<'PY'
          import ctypes
          library = ctypes.CDLL('/lib/x86_64-linux-gnu/libLLVM.so.19.1')
          version = [ctypes.c_uint() for _ in range(3)]
          library.LLVMGetVersion.argtypes = [ctypes.POINTER(ctypes.c_uint)] * 3
          library.LLVMGetVersion(*(ctypes.byref(value) for value in version))
          assert version[0].value == 19, 'ARM64 assembly audits require LLVM 19'
          print('LLVM shared library:', '.'.join(str(value.value) for value in version))
          PY

      - name: Download the matching Xcode 27.2 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/xcode27-artifact
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow xcode27.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId,headSha,status,conclusion | jq -r --arg sha "$GITHUB_SHA" '.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then
              gh run download "$run_id" --name "xcode27-build-$GITHUB_SHA" --dir build/xcode27-artifact
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.76.dylib
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.76.validation.json
              exit 0
            fi
            sleep 10
          done
          echo "No successful Xcode 27.2 build artifact found for $GITHUB_SHA" >&2
          exit 1

      - name: Rebuild twice and verify the exact bytes
        run: python3 scripts/verify162.py --version 1.76 --output build/ci176 --xcode-candidate build/xcode27-artifact/build/xcode27/FanqieX-1.76.dylib

      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/ci176/*.json
            build/ci176/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Package the verified plugin
        if: success()
        run: |
          set -euo pipefail
          # Rebuild the committed distribution from this run after verification.
          rm -rf dist/1.76 verification/1.76
          python3 scripts/package162.py --version 1.76 --verification-dir build/ci176

      - name: Upload the verified plugin
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FanqieX-1.76
          path: |
            dist/1.76/FanqieX-1.76.dylib
            dist/1.76/FanqieX-1.76.zip
            dist/1.76/SHA256SUMS.txt
            dist/1.76/VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
