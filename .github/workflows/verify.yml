name: Verify FanqieX 1.7.2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify172-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the LLVM 19 shared library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libllvm19 clang-19 python3

      - name: Regenerate the shipped ARM64 glass component from reviewed Objective-C source
        run: |
          set -euo pipefail
          python3 scripts/compile_diagnostics.py native/AlignedGlass.m --output build/AlignedGlass.raw.s
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/AlignedGlass.raw.s")
          text = p.read_text(encoding="utf-8").replace("LFQD_", "LFQH_")
          Path("native/AlignedGlass.s").write_text(text, encoding="utf-8")
          PY

      - name: Rebuild twice and verify the exact bytes
        run: python3 scripts/verify162.py --version 1.7.2 --output build/ci172

      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/ci172/*.json
            build/ci172/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Package the verified plugin
        if: success()
        run: python3 scripts/package162.py --version 1.7.2 --verification-dir build/ci172

      - name: Upload the verified plugin
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FanqieX-1.7.2-${{ github.sha }}
          path: |
            dist/1.7.2/FanqieX-1.7.2.dylib
            dist/1.7.2/FanqieX-1.7.2.zip
            dist/1.7.2/SHA256SUMS.txt
            dist/1.7.2/VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
