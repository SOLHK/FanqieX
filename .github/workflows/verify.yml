name: Verify FanqieX 1.7.2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify172-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the LLVM 19 shared library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libllvm19 clang-19 python3

      - name: Download the matching Xcode 27.2 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/xcode27-artifact
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow xcode27.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId,headSha,status,conclusion | jq -r --arg sha "$GITHUB_SHA" '.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then
              gh run download "$run_id" --name "xcode27-build-$GITHUB_SHA" --dir build/xcode27-artifact
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.7.2.dylib
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.7.2.validation.json
              exit 0
            fi
            sleep 10
          done
          echo "No successful Xcode 27.2 build artifact found for $GITHUB_SHA" >&2
          exit 1

      - name: Rebuild twice and verify the exact bytes
        run: python3 scripts/verify162.py --version 1.7.2 --output build/ci172 --xcode-candidate build/xcode27-artifact/build/xcode27/FanqieX-1.7.2.dylib

      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/ci172/*.json
            build/ci172/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Package the verified plugin
        if: success()
        run: python3 scripts/package162.py --version 1.7.2 --verification-dir build/ci172

      - name: Upload the verified plugin
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FanqieX-1.7.2-${{ github.sha }}
          path: |
            dist/1.7.2/FanqieX-1.7.2.dylib
            dist/1.7.2/FanqieX-1.7.2.zip
            dist/1.7.2/SHA256SUMS.txt
            dist/1.7.2/VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
