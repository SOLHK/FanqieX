name: Verify FanqieX 1.8R14

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify179r5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the test release identity
        run: test "$(cat VERSION)" = '1.8R14'

      - name: Check the runner's preinstalled LLVM and Clang
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          /usr/bin/clang-18 --version
          echo 'FQ_NATIVE_CLANG=/usr/bin/clang-18' >> "$GITHUB_ENV"
          python3 - <<'PY'
          import ctypes
          library = ctypes.CDLL('/lib/x86_64-linux-gnu/libLLVM.so.19.1')
          version = [ctypes.c_uint() for _ in range(3)]
          library.LLVMGetVersion.argtypes = [ctypes.POINTER(ctypes.c_uint)] * 3
          library.LLVMGetVersion(*(ctypes.byref(value) for value in version))
          assert version[0].value == 19, 'ARM64 assembly audits require LLVM 19'
          print('LLVM shared library:', '.'.join(str(value.value) for value in version))
          PY

      - name: Regenerate the exact ARM64 glass source used by the Xcode build
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/compile_diagnostics.py native/AlignedGlass.m --output build/AlignedGlass.raw.s
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/AlignedGlass.raw.s")
          Path("native/AlignedGlass.s").write_text(p.read_text(encoding="utf-8").replace("LFQD_", "LFQH_"), encoding="utf-8")
          PY

      - name: Download the same-commit Xcode build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/xcode27-artifact
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow xcode27.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId,headSha,status,conclusion | jq -r --arg sha "$GITHUB_SHA" '.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then
              gh run download "$run_id" --name "xcode27-build-$GITHUB_SHA" --dir build/xcode27-artifact
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.8R14.dylib
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.8R14.validation.json
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.8R14.composed.s
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.8R14.preextend
              test -s build/xcode27-artifact/build/xcode27/FanqieX-1.8R14.extension.bin
              test -s build/xcode27-artifact/build/xcode27/xcode-build-report.json
              test -s build/xcode27-artifact/build/xcode27/integrated/FanqieX-1.8R14.dylib
              test -s build/xcode27-artifact/build/xcode27/integrated/book-export-build-report.json
              test -s build/xcode27-artifact/build/xcode27/book-export-smoke.json
              exit 0
            fi
            sleep 10
          done
          echo "No successful Xcode build artifact found for $GITHUB_SHA" >&2
          exit 1

      - name: Rebuild twice and verify the exact bytes
        run: python3 scripts/verify162.py --version 1.8R14 --output build/ci18r14 --xcode-candidate build/xcode27-artifact/build/xcode27/FanqieX-1.8R14.dylib

      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/ci18r14/*.json
            build/ci18r14/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Package the verified plugin
        if: success()
        run: |
          set -euo pipefail
          # Rebuild the committed distribution from this run after verification.
          rm -rf dist/1.8R14 verification/1.8R14
          python3 scripts/package162.py --version 1.8R14 --verification-dir build/ci18r14 --export-dir build/xcode27-artifact/build/xcode27

      - name: Upload the verified plugin
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FanqieX-1.8R14
          path: |
            dist/1.8R14/FanqieX-1.8R14.dylib
            dist/1.8R14/FanqieX-1.8R14.zip
            dist/1.8R14/SHA256SUMS.txt
            dist/1.8R14/VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
