name: Xcode 27 plugin build

on:
  push:
    branches: [main, test, 'work/162-*', 'work/163-*', 'work/164-*', 'work/178r11-*', 'work/178r12-*', 'work/178r13-*', 'work/178r14-*', 'work/178r15-*', 'work/178r16-*', 'work/179r1-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-toolchain:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check the test release identity
        run: test "$(cat VERSION)" = '2.0.1beta5'
      - name: Preserve the exact source checkout for reproducible diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/xcode27
          git archive --format=zip --output=build/xcode27/source-checkout.zip HEAD
      - name: Select Xcode 27.3 or 27.2
        shell: bash
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR
          for app in /Applications/Xcode_27.3.app /Applications/Xcode_27.3.0.app /Applications/Xcode_27.3_beta.app /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ]; then
              export DEVELOPER_DIR="$app/Contents/Developer"
              break
            fi
          done
          if [ -z "${DEVELOPER_DIR:-}" ]; then
            printf 'Runner image %s has these Xcode installations:\n' "${ImageVersion:-unknown}" >&2
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print >&2
            printf '::error::This runner does not have Xcode 27.3 or 27.2.\n'
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Exercise the diagnostic module with real Foundation and libobjc
        run: python3 tests/run_native_smoke.py
      - name: Verify owned Objective-C hook installation
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -I native tests/native_hook_installer_smoke.m native/FQXHookInstaller.m -framework Foundation -lobjc -o build/xcode27/hook-installer-smoke
          build/xcode27/hook-installer-smoke
      - name: Exercise the startup journal on real Foundation
        run: python3 tests/run_logger_startup_smoke.py
      - name: Check background defaults notifications during launch
        run: python3 tests/test_pendant_startup_notification.py
      - name: Check bookshelf adaptation card filtering
        run: python3 tests/test_shelf_adaptation_card.py
      - name: Regenerate the shipped ARM64 glass component from reviewed Objective-C source
        run: |
          set -euo pipefail
          python3 scripts/compile_diagnostics.py native/AlignedGlass.m --output build/AlignedGlass.raw.s
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/AlignedGlass.raw.s")
          text = p.read_text(encoding="utf-8").replace("LFQD_", "LFQH_")
          Path("native/AlignedGlass.s").write_text(text, encoding="utf-8")
          PY
      - name: Build actual plugin twice and type-check native APIs
        run: python3 scripts/build_xcode27.py --repair-dir repair162 --version 2.0.1beta5
      - name: Build FanqieX with integrated export and settings modules
        run: python3 scripts/build_book_export.py --core build/xcode27/FanqieX-2.0.1beta5.dylib --output build/xcode27/integrated
      - name: Verify Naloia vector parity and heartbeat motion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_naloia_icon_paths.py -v
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -I native tests/native_naloia_scan_smoke.c -o build/xcode27/naloia-scan-smoke
          build/xcode27/naloia-scan-smoke | tee build/xcode27/naloia-scan-run.log
      - name: Exercise export formats and local chapter sources on real Foundation
        run: python3 tests/run_book_export_formats.py --output build/xcode27
      - name: Exercise settings backup and video container recognition
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_settings_backup_store.py
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -I native tests/native_settings_backup_smoke.c native/FanqieXSettingsCodec.c -lz -o build/xcode27/settings-backup-smoke
          build/xcode27/settings-backup-smoke | tee build/xcode27/settings-backup-run.log
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror tests/native_video_container_smoke.c -o build/xcode27/video-container-smoke
          build/xcode27/video-container-smoke | tee build/xcode27/video-container-run.log
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -I native tests/native_blur_control_smoke.c -o build/xcode27/blur-control-smoke
          build/xcode27/blur-control-smoke | tee build/xcode27/blur-control-run.log
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -I native tests/native_mine_shortcut_geometry_smoke.c -o build/xcode27/mine-shortcut-smoke
          build/xcode27/mine-shortcut-smoke | tee build/xcode27/mine-shortcut-run.log
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -I native tests/native_layout_sheet_policy_smoke.c -o build/xcode27/layout-sheet-policy-smoke
          build/xcode27/layout-sheet-policy-smoke | tee build/xcode27/layout-sheet-policy-run.log
      - name: Preserve build and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xcode27-build-${{ github.sha }}
          path: |
            build/xcode27/*.dylib
            build/xcode27/*.json
            build/xcode27/integrated/*.dylib
            build/xcode27/integrated/*.json
            build/xcode27/integrated/export-link/*.dylib
            build/xcode27/integrated/export-rebuild/*.dylib
            build/xcode27/*.zip
            build/xcode27/*.composed.s
            build/xcode27/*.preextend
            build/xcode27/*.extension.bin
            build/xcode27/SHA256SUMS.txt
            build/xcode27/*-compile.log
            build/xcode27/*-run.log
            native/AlignedGlass.s
            build/native-smoke/*.json
            build/native-smoke/*.log
            build/logger-startup-smoke/*.json
            build/logger-startup-smoke/*.log
          if-no-files-found: warn
          retention-days: 30
