name: Xcode 27.2 plugin build

on:
  push:
    branches: [test, 'work/162-*', 'work/163-*', 'work/164-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-toolchain:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_27.2.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Exercise the diagnostic module with real Foundation and libobjc
        run: python3 tests/run_native_smoke.py
      - name: Build actual plugin twice and type-check native APIs
        run: python3 scripts/build_xcode27.py --repair-dir repair162 --version 1.6.4 --expect-candidate dist/1.6.4/FanqieX-1.6.4.dylib
      - name: Preserve build and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xcode27-build-${{ github.sha }}
          path: |
            build/xcode27/*.dylib
            build/xcode27/*.json
            build/xcode27/SHA256SUMS.txt
            build/native-smoke/*.json
            build/native-smoke/*.log
          if-no-files-found: warn
          retention-days: 30
