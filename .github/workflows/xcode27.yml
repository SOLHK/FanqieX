name: Xcode 27.2 plugin build

on:
  push:
    branches: [main, test, 'work/162-*', 'work/163-*', 'work/164-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xcode27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-toolchain:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Select Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_27.2.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Exercise the diagnostic module with real Foundation and libobjc
        run: python3 tests/run_native_smoke.py
      - name: Exercise the startup journal on real Foundation
        run: python3 tests/run_logger_startup_smoke.py
      - name: Regenerate the shipped ARM64 glass component from reviewed Objective-C source
        run: |
          set -euo pipefail
          python3 scripts/compile_diagnostics.py native/AlignedGlass.m --output build/AlignedGlass.raw.s
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/AlignedGlass.raw.s")
          text = p.read_text(encoding="utf-8").replace("LFQD_", "LFQH_")
          Path("native/AlignedGlass.s").write_text(text, encoding="utf-8")
          PY
      - name: Build actual plugin twice and type-check native APIs
        run: python3 scripts/build_xcode27.py --repair-dir repair162 --version 1.7.2
      - name: Preserve build and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xcode27-build-${{ github.sha }}
          path: |
            build/xcode27/*.dylib
            build/xcode27/*.json
            build/xcode27/SHA256SUMS.txt
            native/AlignedGlass.s
            build/native-smoke/*.json
            build/native-smoke/*.log
            build/logger-startup-smoke/*.json
            build/logger-startup-smoke/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Commit regenerated ARM64 glass assembly to test branch
        if: github.ref == 'refs/heads/test'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/AlignedGlass.s
          if git diff --cached --quiet; then
            echo "Generated assembly already matches the committed source."
            exit 0
          fi
          git commit -m "Regenerate aligned glass ARM64 assembly"
          git push origin HEAD:test
